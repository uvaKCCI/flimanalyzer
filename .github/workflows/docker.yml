name: Docker

# Publishes the headless batch image (flimbatch) to the GitHub Container Registry for
# each published GitHub release (never from a tag push alone):
#   ghcr.io/uvakcci/flimanalyzer:<version>-cpu, :latest-cpu  (CPU PyTorch; amd64, arm64)
#   ghcr.io/uvakcci/flimanalyzer:<version>, :latest          (CUDA PyTorch; amd64)
# Each image is checked before it is pushed (.github/scripts/check-image.sh). Pull
# requests only build and test the image (tests.yml).

on:
  release:
    types: [published]
  workflow_dispatch:  # a branch: tagged with its name; a release tag: rebuilds its images

permissions:
  contents: read
  packages: write  # push to ghcr.io with GITHUB_TOKEN

env:
  IMAGE: ghcr.io/uvakcci/flimanalyzer

jobs:
  publish:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 120  # arm64 builds run under emulation
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            suffix: -cpu
            platforms: linux/amd64,linux/arm64
            torch_index: https://download.pytorch.org/whl/cpu
          - variant: cuda
            suffix: ""
            platforms: linux/amd64
            torch_index: ""  # the CUDA build from uv.lock
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # versioningit derives the version from the git tags

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !github.event.release.prerelease }}

      - name: Free disk space for the CUDA image
        if: matrix.variant == 'cuda'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Per-build metadata
        id: build
        # base image: the runtime stage's FROM line (pinned by digest)
        run: |
          base=$(awk '/^FROM /{b=$2} END{print b}' Dockerfile)
          {
            echo "args<<EOF"
            echo "TORCH_INDEX=${{ matrix.torch_index }}"
            echo "VERSION=${{ steps.meta.outputs.version }}"
            echo "REVISION=${{ github.sha }}"
            echo "CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}"
            echo "BASE_NAME=docker.io/library/${base%@*}"
            echo "BASE_DIGEST=${base#*@}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # test before push (docs.docker.com/build/ci/github-actions/test-before-push/):
      # amd64 into the local engine; the push below reuses its build from the cache
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: ${{ steps.build.outputs.args }}
          tags: flimanalyzer:test
          load: true

      - name: Check the image
        id: check
        run: |
          version=""
          [[ "$GITHUB_REF" == refs/tags/v* ]] && version="${GITHUB_REF_NAME#v}"
          .github/scripts/check-image.sh flimanalyzer:test "$GITHUB_SHA" "$version"
          # the labels also as manifest and index annotations: GitHub reads a
          # multi-platform image's description from the index
          {
            echo "annotations<<EOF"
            docker inspect -f '{{ range $k, $v := .Config.Labels }}{{ $k }}={{ $v }}{{ "\n" }}{{ end }}' flimanalyzer:test \
              | grep '^org\.opencontainers\.image\.' | sed -e 's/^/manifest:/p' -e 's/^manifest:/index:/'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platforms }}
          build-args: ${{ steps.build.outputs.args }}
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.check.outputs.annotations }}
          push: true
