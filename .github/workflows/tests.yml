name: Tests

on:
  pull_request:
    branches: [main, dev, "release/**"]  # release/X.Y.x: maintenance branches
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # OIDC upload to Codecov, no token secret needed

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.python }})
    # macOS: wxPython has no Linux wheels on PyPI; the runner also has a GUI
    # session, so the dialog tests run instead of being skipped
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]  # oldest and newest supported (~10 min each)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # versioningit derives the version from the git tags

      - uses: astral-sh/setup-uv@v10.3.0  # no moving major tag is published
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra gui --extra test --extra dask --python ${{ matrix.python }}

      - name: Run tests
        env:
          PREFECT_SERVER_ANALYTICS_ENABLED: "false"
        run: uv run --frozen --no-sync pytest -v --cov --cov-report=xml

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.python == '3.12' }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: false  # a Codecov outage must not block merges

  core:
    name: core (no gui) (${{ matrix.python }})
    # the core must work without wxPython (the gui extra) and without torch:
    # installs the other dependencies from the lock file and runs the core tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies without wxPython and torch
        run: |
          uv export --frozen --extra test --no-group gui --no-hashes --no-emit-project --no-annotate --no-header \
            | grep -v -E '^(torch|nvidia-|triton|cuda-)' > core-requirements.txt
          uv venv --python ${{ matrix.python }}
          uv pip install --no-deps -r core-requirements.txt
          uv pip install --no-deps -e .

      - name: Check that wxPython is not installed and flimbatch starts
        run: |
          .venv/bin/python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('wx') is not None)"
          .venv/bin/flimbatch --help

      - name: Run core tests
        env:
          PREFECT_SERVER_ANALYTICS_ENABLED: "false"
        run: .venv/bin/python -m pytest -v tests/core

  docker:
    name: docker (headless)
    # the batch image builds and runs; the CPU build of PyTorch keeps it small.
    # Not published: see docker.yml (releases)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # versioningit derives the version from the git tags

      - name: Check for changes to the image
        id: changes
        # pull requests: only if the image's files changed; pushes: always
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || git diff --name-only \
              "origin/${{ github.base_ref }}...HEAD" -- Dockerfile .dockerignore \
              pyproject.toml uv.lock src .github/scripts/check-image.sh | grep -q .; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to the image's files: not built"
          fi

      - name: Build the image
        if: steps.changes.outputs.build == 'true'
        run: >
          docker build -t flimanalyzer:ci
          --build-arg TORCH_INDEX=https://download.pytorch.org/whl/cpu
          --build-arg REVISION=${{ github.sha }} .

      - name: Run flimbatch in the image
        if: steps.changes.outputs.build == 'true'
        run: |
          .github/scripts/check-image.sh flimanalyzer:ci "${{ github.sha }}"
          mkdir -p work/data
          printf 'x\ty\n1\t2\n3\t4\n' > work/data/Results_FOV1_WT_1.txt
          # a tool file (Summarize needs at least one feature, #204: both columns)
          printf '{"schema_version": 2, "tool": "Summarize", "config": {"features": ["x", "y"]}}\n' \
            > work/summarize.json
          docker run --rm -u "$(id -u)" -v "$PWD/work:/work" flimanalyzer:ci \
            -i data -o results --run summarize.json --no-prefect-server
          # <output>/<date and time>/run-1/<id>-<tool>/<table>/, with the run's records
          run=$(find work/results -mindepth 2 -maxdepth 2 -type d -name run-1)
          test -n "$(find "$run/01-Summarize" -name 'Table_Summary.txt')"
          test -s "$run/resolved.json"
          grep -q '^Inputs:' "$run/run_summary.txt"

  install:
    name: install (${{ matrix.os }}, ${{ matrix.python }}, ${{ matrix.extras || 'no extras' }})
    # a clean install as users make it: the built wheel with its extras, resolved from
    # pyproject.toml (not uv.lock), in a new environment, then a smoke test of each
    # extra. wxPython has no Linux wheels on PyPI: the gui extra is tested on macOS and
    # Windows. Bash on every runner (Git Bash on Windows)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
        os: [ubuntu-latest]
        extras: ["", "dask", "test", "dask,test"]
        include:
          - {os: macos-latest, python: "3.12", extras: "gui"}
          - {os: macos-latest, python: "3.14", extras: "gui"}
          - {os: macos-latest, python: "3.12", extras: "gui,dask,test"}
          - {os: macos-latest, python: "3.14", extras: "gui,dask,test"}
          - {os: windows-latest, python: "3.12", extras: ""}
          - {os: windows-latest, python: "3.14", extras: ""}
          - {os: windows-latest, python: "3.12", extras: "gui,dask,test"}
          - {os: windows-latest, python: "3.14", extras: "gui,dask,test"}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # versioningit derives the version from the git tags

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Install the wheel with its extras in a new environment
        run: |
          uv venv --python ${{ matrix.python }} clean
          wheel=$(ls dist/*.whl)
          spec="$wheel"; [ -n "${{ matrix.extras }}" ] && spec="$wheel[${{ matrix.extras }}]"
          bin=clean/bin; [ "$RUNNER_OS" = Windows ] && bin=clean/Scripts
          echo "BIN=$bin" >> "$GITHUB_ENV"
          uv pip install --python "$bin/python" "$spec"

      - name: Smoke test
        env:
          PREFECT_SERVER_ANALYTICS_ENABLED: "false"
          EXTRAS: ",${{ matrix.extras }},"
        run: |
          set -e
          "$BIN"/python -c "import flim; print(flim.__version__)"
          "$BIN"/flimbatch --help > /dev/null
          "$BIN"/flimsettings --help > /dev/null
          "$BIN"/flimsettings tool --list > /dev/null
          mkdir -p work/data
          printf 'Treatment\tFLIRR\nctrl\t1.0\nDox\t2.0\n' > work/data/a.txt
          printf '{"schema_version": 2, "tool": "Summarize", "config": {"features": ["FLIRR"], "aggs": ["mean"]}}\n' \
            > work/summarize.json
          "$BIN"/flimbatch -i work/data -o work/out --run work/summarize.json --no-prefect-server
          test -n "$(find work/out -name run_summary.txt)"
          case "$EXTRAS" in *,dask,*)
            "$BIN"/flimbatch -i work/data -o work/out-dask --run work/summarize.json \
              -e dask-local:workers=2 --no-prefect-server ;;
          esac
          case "$EXTRAS" in *,gui,*)
            "$BIN"/python -c "import wx, flim.gui, flim.gui.app; print(wx.version())"
            # a GUI program on Windows, without a console: --help prints nothing there
            [ "$RUNNER_OS" = Windows ] || "$BIN"/flimanalyzer --help > /dev/null ;;
          esac
          case "$EXTRAS" in *,test,*)
            "$BIN"/python -m pytest -q -p no:cacheprovider tests/core/test_cli.py tests/core/test_hashing.py ;;
          esac

  docs:
    name: docs
    # builds the documentation as Read the Docs does (.readthedocs.yaml): only the
    # "docs" dependency group, flimanalyzer imported from the source tree; warnings fail
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install the docs dependency group
        run: uv sync --frozen --only-group docs --python 3.12

      - name: Build the documentation
        run: uv run --frozen --no-sync python -m sphinx -W --keep-going -E -b html docs docs/_build/html

  checks:
    name: all checks
    # the one required check (main, release/* ruleset): passes only if every job above
    # passed, so the matrix can change without touching branch protection. The docker
    # job's skipped build (no image changes) counts as passed: its job result is success
    if: always()
    needs: [tests, core, install, docker, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "A job ended with: $r"; exit 1 ;; esac
          done
