name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # OIDC upload to Codecov, no token secret needed

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    # macOS: wxPython has no Linux wheels on PyPI; the runner also has a GUI
    # session, so the dialog tests run instead of being skipped
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # versioningit derives the version from the git tags

      - uses: astral-sh/setup-uv@v10.3.0  # no moving major tag is published
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra test --extra dask --python 3.12

      - name: Run tests
        env:
          PREFECT_SERVER_ANALYTICS_ENABLED: "false"
        run: uv run --frozen --no-sync pytest -v --cov --cov-report=xml

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: false  # a Codecov outage must not block merges

  core:
    name: core (no wx)
    # flim.core must work without wxPython (and without torch): installs everything
    # else from the lock file and runs the core tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies without wxPython and torch
        run: |
          uv export --frozen --extra test --no-hashes --no-emit-project --no-annotate --no-header \
            | grep -v -E '^(wxpython|torch|nvidia-|triton|cuda-)' > core-requirements.txt
          uv venv --python 3.12
          uv pip install --no-deps -r core-requirements.txt
          uv pip install --no-deps -e .

      - name: Run core tests
        env:
          PREFECT_SERVER_ANALYTICS_ENABLED: "false"
        run: .venv/bin/python -m pytest -v tests/core
