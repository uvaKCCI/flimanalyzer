name: Tests

on:
  pull_request:
    branches: [main, dev, "release/**"]  # release/X.Y.x: maintenance branches
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # OIDC upload to Codecov, no token secret needed

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    # what a pull request changes in its target branch, so the other jobs run only for
    # what is affected: nothing (e.g. main into dev without own commits): all skipped;
    # only docs/ or *.md files at the top: only the docs build; anything else (code,
    # tests, workflows, dependencies): all jobs. Pull requests into dev run one Python
    # version (`full` false); into main and release/*, and pushes: all versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      docs: ${{ steps.diff.outputs.docs }}
      full: ${{ steps.diff.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # a pull request's merge commit and its target branch (HEAD^1)

      - name: Compare with the target branch
        id: diff
        run: |
          full=true
          [ "${{ github.event_name }}" = pull_request ] && [ "${{ github.base_ref }}" = dev ] && full=false
          echo "full=$full" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files:"; echo "${files:-(none)}"
          docs=false; code=false
          # the docs build imports flim from src: any change runs it (about a minute)
          [ -n "$files" ] && docs=true
          # no `grep -q` at the end of a pipe: with pipefail, an early exit fails the pipe
          others=$(printf '%s\n' "$files" | grep -v -E '^(docs/.*|[^/]+\.md)$' || true)
          [ -n "$others" ] && code=true
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "docs=$docs code=$code full=$full"

  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.python }})
    # the GUI tests (tests/, without tests/core: the core jobs run those with every
    # extra but gui). macOS: wxPython has no Linux wheels on PyPI; the runner has a GUI
    # session, so the dialog tests run instead of being skipped. Pull requests into
    # dev: 3.14; into main and release/*, and pushes: 3.12 and 3.14. Windows (one job,
    # the newest Python, decided 2026-11-21) is left out until its failures in CI are
    # understood (milestones, Unscheduled, 2026-11-23); the matrix keeps `os` for it.
    # Serial: the GUI tests fail and hang in parallel (modal dialogs depend on their
    # event loop and timing; decided 2026-11-02)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["3.12", "3.14"]' || '["3.14"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # versioningit derives the version from the git tags

      - uses: astral-sh/setup-uv@v10.3.0  # no moving major tag is published
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra gui --extra test --extra dask --python ${{ matrix.python }}

      - name: Run tests
        env:
          PREFECT_SERVER_ANALYTICS_ENABLED: "false"
        run: |
          cov=""
          [ "${{ matrix.os }}" = macos-latest ] && [ "${{ matrix.python }}" = "3.14" ] && cov="--cov --cov-report=xml"
          uv run --frozen --no-sync pytest -v --durations=20 $cov tests --ignore=tests/core

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.os == 'macos-latest' && matrix.python == '3.14' }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: false  # a Codecov outage must not block merges

  # TEMPORARY (0.7.1, 2026-11-24): the Dask hang on Windows (milestones, 0.7.1), before
  # and after the lock update; removed before merging. Not part of `all checks`
  windows-dask:
    name: windows dask (${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install (no GUI)
        run: uv sync --frozen --extra test --extra dask --no-group gui --python ${{ matrix.python }}
      - name: distributed version
        run: uv run --frozen --no-sync python -c "import distributed; print('distributed', distributed.__version__)"
      - name: The Dask cancel test
        env:
          PREFECT_SERVER_ANALYTICS_ENABLED: "false"
        run: uv run --frozen --no-sync pytest -v "tests/test_cancel.py::test_task_cancelling_itself_skips_only_its_dependents"

  core:
    name: core (no gui) (${{ matrix.python }})
    # the core with everything but the GUI: all extras except gui (wxPython), torch
    # (CPU), from the lock file; runs the core tests in parallel (pytest-xdist): the
    # core tests do not use wx. Pull requests into dev: 3.14 only
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["3.12", "3.13", "3.14"]' || '["3.14"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      # every extra except gui (an extra added later is included), from the lock file;
      # torch as its CPU build of the locked version (the lock has the CUDA build for
      # Linux), as the CI Docker build
      - name: Install all dependencies except wxPython, with CPU torch
        run: |
          uv export --frozen --all-extras --no-extra gui --no-group gui --no-hashes --no-emit-project \
            --no-annotate --no-header > all-requirements.txt
          torch=$(grep -oE '^torch==[0-9.]+' all-requirements.txt | head -n 1)
          grep -v -E '^(torch|nvidia-|triton|cuda-)' all-requirements.txt > core-requirements.txt
          uv venv --python ${{ matrix.python }}
          uv pip install --no-deps -r core-requirements.txt
          uv pip install --no-deps --index-url https://download.pytorch.org/whl/cpu "$torch"
          uv pip install --no-deps -e .

      - name: Check that wxPython is not installed and flimbatch starts
        run: |
          .venv/bin/python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('wx') is not None)"
          .venv/bin/flimbatch --help

      - name: Run core tests
        env:
          PREFECT_SERVER_ANALYTICS_ENABLED: "false"
        run: |
          cov=""
          [ "${{ matrix.python }}" = "3.14" ] && cov="--cov --cov-report=xml"
          .venv/bin/python -m pytest -v -n auto --durations=20 $cov tests/core

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.python == '3.14' }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: false  # a Codecov outage must not block merges

  docker:
    name: docker (headless)
    # the batch image builds and runs; the CPU build of PyTorch keeps it small.
    # Not published: see docker.yml (releases)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # versioningit derives the version from the git tags

      - name: Check for changes to the image
        id: changes
        # pull requests: only if the image's files changed; pushes: always
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || git diff --name-only \
              "origin/${{ github.base_ref }}...HEAD" -- Dockerfile .dockerignore \
              pyproject.toml uv.lock src .github/scripts/check-image.sh | grep -q .; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to the image's files: not built"
          fi

      - name: Build the image
        if: steps.changes.outputs.build == 'true'
        run: >
          docker build -t flimanalyzer:ci
          --build-arg TORCH_INDEX=https://download.pytorch.org/whl/cpu
          --build-arg REVISION=${{ github.sha }} .

      - name: Run flimbatch in the image
        if: steps.changes.outputs.build == 'true'
        run: |
          .github/scripts/check-image.sh flimanalyzer:ci "${{ github.sha }}"
          mkdir -p work/data
          printf 'x\ty\n1\t2\n3\t4\n' > work/data/Results_FOV1_WT_1.txt
          # a tool file (Summarize needs at least one feature, #204: both columns)
          printf '{"schema_version": 2, "tool": "Summarize", "config": {"features": ["x", "y"]}}\n' \
            > work/summarize.json
          docker run --rm -u "$(id -u)" -v "$PWD/work:/work" flimanalyzer:ci \
            -i data -o results --run summarize.json --no-prefect-server
          # <output>/<date and time>/run-1/<id>-<tool>/<table>/, with the run's records
          run=$(find work/results -mindepth 2 -maxdepth 2 -type d -name run-1)
          test -n "$(find "$run/01-Summarize" -name 'Table_Summary.txt')"
          test -s "$run/resolved.json"
          grep -q '^Inputs:' "$run/run_summary.txt"

  install:
    name: install (${{ matrix.os }}, ${{ matrix.python }}, ${{ matrix.extras || 'no extras' }})
    # a clean install as users make it: the built wheel with its extras, resolved from
    # pyproject.toml (not uv.lock), in a new environment, then a smoke test of each
    # extra. wxPython has no Linux wheels on PyPI: the gui extra is tested on macOS and
    # Windows. Bash on every runner (Git Bash on Windows). Linux: no extras (the core
    # without optional packages) and dask,test (the extras' checks); single extras add
    # nothing that these two miss
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
        os: [ubuntu-latest]
        extras: ["", "dask,test"]
        include:
          - {os: macos-latest, python: "3.12", extras: "gui"}
          - {os: macos-latest, python: "3.14", extras: "gui"}
          - {os: macos-latest, python: "3.12", extras: "gui,dask,test"}
          - {os: macos-latest, python: "3.14", extras: "gui,dask,test"}
          - {os: windows-latest, python: "3.12", extras: ""}
          - {os: windows-latest, python: "3.14", extras: ""}
          - {os: windows-latest, python: "3.12", extras: "gui,dask,test"}
          - {os: windows-latest, python: "3.14", extras: "gui,dask,test"}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # versioningit derives the version from the git tags

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Install the wheel with its extras in a new environment
        run: |
          uv venv --python ${{ matrix.python }} clean
          wheel=$(ls dist/*.whl)
          spec="$wheel"; [ -n "${{ matrix.extras }}" ] && spec="$wheel[${{ matrix.extras }}]"
          bin=clean/bin; python=$bin/python
          # uv needs the .exe on Windows; Git Bash runs the programs without it
          [ "$RUNNER_OS" = Windows ] && bin=clean/Scripts && python=$bin/python.exe
          echo "BIN=$bin" >> "$GITHUB_ENV"
          uv pip install --python "$python" "$spec"

      - name: Smoke test
        env:
          PREFECT_SERVER_ANALYTICS_ENABLED: "false"
          EXTRAS: ",${{ matrix.extras }},"
        run: |
          set -e
          "$BIN"/python -c "import flim; print(flim.__version__)"
          "$BIN"/flimbatch --help > /dev/null
          "$BIN"/flimsettings --help > /dev/null
          "$BIN"/flimsettings tool --list > /dev/null
          mkdir -p work/data
          printf 'Treatment\tFLIRR\nctrl\t1.0\nDox\t2.0\n' > work/data/a.txt
          printf '{"schema_version": 2, "tool": "Summarize", "config": {"features": ["FLIRR"], "aggs": ["mean"]}}\n' \
            > work/summarize.json
          "$BIN"/flimbatch -i work/data -o work/out --run work/summarize.json --no-prefect-server
          test -n "$(find work/out -name run_summary.txt)"
          case "$EXTRAS" in *,dask,*)
            "$BIN"/flimbatch -i work/data -o work/out-dask --run work/summarize.json \
              -e dask-local:workers=2 --no-prefect-server ;;
          esac
          case "$EXTRAS" in *,gui,*)
            "$BIN"/python -c "import wx, flim.gui, flim.gui.app; print(wx.version())"
            # a GUI program on Windows, without a console: --help prints nothing there
            [ "$RUNNER_OS" = Windows ] || "$BIN"/flimanalyzer --help > /dev/null ;;
          esac
          case "$EXTRAS" in *,test,*)
            "$BIN"/python -m pytest -q -p no:cacheprovider tests/core/test_cli.py tests/core/test_hashing.py ;;
          esac

  docs:
    name: docs
    # builds the documentation as Read the Docs does (.readthedocs.yaml): only the
    # "docs" dependency group, flimanalyzer imported from the source tree; warnings fail
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the release tags, for the changelog check

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install the docs dependency group
        run: uv sync --frozen --only-group docs --python 3.12

      # a section per release in CHANGELOG.md; every docs image retaken by
      # docs/screenshots.py or an app icon, and used. No flim import, so no conftest;
      # pytest as in uv.lock (the core jobs run the same file)
      - name: Release records
        run: uv run --frozen --no-sync --with pytest==9.1.1 python -m pytest -q --noconftest -p no:cacheprovider tests/core/test_release_records.py

      - name: Build the documentation
        run: uv run --frozen --no-sync python -m sphinx -W --keep-going -E -b html docs docs/_build/html

  checks:
    name: all checks
    # the one required check (main, release/* ruleset): passes only if every job above
    # passed, so the matrix can change without touching branch protection. A job that
    # is skipped (nothing it checks changed, see the changes job) counts as passed
    if: always()
    needs: [changes, tests, core, install, docker, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "A job ended with: $r"; exit 1 ;; esac
          done
