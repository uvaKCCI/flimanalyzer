name: Tests

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # OIDC upload to Codecov, no token secret needed

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    # macOS: wxPython has no Linux wheels on PyPI; the runner also has a GUI
    # session, so the dialog tests run instead of being skipped
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # versioningit derives the version from the git tags

      - uses: astral-sh/setup-uv@v10.3.0  # no moving major tag is published
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra gui --extra test --extra dask --python 3.12

      - name: Run tests
        env:
          PREFECT_SERVER_ANALYTICS_ENABLED: "false"
        run: uv run --frozen --no-sync pytest -v --cov --cov-report=xml

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: false  # a Codecov outage must not block merges

  core:
    name: core (no wx)
    # the core must work without wxPython (the gui extra) and without torch:
    # installs the other dependencies from the lock file and runs the core tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies without wxPython and torch
        run: |
          uv export --frozen --extra test --no-dev --no-hashes --no-emit-project --no-annotate --no-header \
            | grep -v -E '^(torch|nvidia-|triton|cuda-)' > core-requirements.txt
          uv venv --python 3.12
          uv pip install --no-deps -r core-requirements.txt
          uv pip install --no-deps -e .

      - name: Check that wxPython is not installed and flimbatch starts
        run: |
          .venv/bin/python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('wx') is not None)"
          .venv/bin/flimbatch --help

      - name: Run core tests
        env:
          PREFECT_SERVER_ANALYTICS_ENABLED: "false"
        run: .venv/bin/python -m pytest -v tests/core

  docker:
    name: docker (headless)
    # the batch image builds and runs; the CPU build of PyTorch keeps it small.
    # Not published: see docker.yml (releases)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # versioningit derives the version from the git tags

      - name: Check for changes to the image
        id: changes
        # pull requests: only if the image's files changed; pushes: always
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || git diff --name-only \
              "origin/${{ github.base_ref }}...HEAD" -- Dockerfile .dockerignore \
              pyproject.toml uv.lock flim | grep -q .; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to the image's files: not built"
          fi

      - name: Build the image
        if: steps.changes.outputs.build == 'true'
        run: >
          docker build -t flimanalyzer:ci
          --build-arg TORCH_INDEX=https://download.pytorch.org/whl/cpu .

      - name: Run flimbatch in the image
        if: steps.changes.outputs.build == 'true'
        run: |
          docker run --rm flimanalyzer:ci --help
          mkdir -p work/data
          printf 'x\ty\n1\t2\n3\t4\n' > work/data/Results_FOV1_WT_1.txt
          docker run --rm -u "$(id -u)" -v "$PWD/work:/work" flimanalyzer:ci \
            -i data -o results --run Summarize --no-prefect-server
          test -s work/results/Imported.txt
          test -n "$(ls work/results/Summarize)"
