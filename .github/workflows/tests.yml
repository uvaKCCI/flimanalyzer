name: Tests

on:
  pull_request:
    branches: [main, dev, "release/**"]  # release/X.Y.x: maintenance branches
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # OIDC upload to Codecov, no token secret needed

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.python }})
    # macOS: wxPython has no Linux wheels on PyPI; the runner also has a GUI
    # session, so the dialog tests run instead of being skipped
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]  # oldest and newest supported (~10 min each)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # versioningit derives the version from the git tags

      - uses: astral-sh/setup-uv@v10.3.0  # no moving major tag is published
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra gui --extra test --extra dask --python ${{ matrix.python }}

      - name: Run tests
        env:
          PREFECT_SERVER_ANALYTICS_ENABLED: "false"
        run: uv run --frozen --no-sync pytest -v --cov --cov-report=xml

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.python == '3.12' }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: false  # a Codecov outage must not block merges

  core:
    name: core (no gui) (${{ matrix.python }})
    # the core must work without wxPython (the gui extra) and without torch:
    # installs the other dependencies from the lock file and runs the core tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies without wxPython and torch
        run: |
          uv export --frozen --extra test --no-group gui --no-hashes --no-emit-project --no-annotate --no-header \
            | grep -v -E '^(torch|nvidia-|triton|cuda-)' > core-requirements.txt
          uv venv --python ${{ matrix.python }}
          uv pip install --no-deps -r core-requirements.txt
          uv pip install --no-deps -e .

      - name: Check that wxPython is not installed and flimbatch starts
        run: |
          .venv/bin/python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('wx') is not None)"
          .venv/bin/flimbatch --help

      - name: Run core tests
        env:
          PREFECT_SERVER_ANALYTICS_ENABLED: "false"
        run: .venv/bin/python -m pytest -v tests/core

  docker:
    name: docker (headless)
    # the batch image builds and runs; the CPU build of PyTorch keeps it small.
    # Not published: see docker.yml (releases)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # versioningit derives the version from the git tags

      - name: Check for changes to the image
        id: changes
        # pull requests: only if the image's files changed; pushes: always
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || git diff --name-only \
              "origin/${{ github.base_ref }}...HEAD" -- Dockerfile .dockerignore \
              pyproject.toml uv.lock flim .github/scripts/check-image.sh | grep -q .; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to the image's files: not built"
          fi

      - name: Build the image
        if: steps.changes.outputs.build == 'true'
        run: >
          docker build -t flimanalyzer:ci
          --build-arg TORCH_INDEX=https://download.pytorch.org/whl/cpu
          --build-arg REVISION=${{ github.sha }} .

      - name: Run flimbatch in the image
        if: steps.changes.outputs.build == 'true'
        run: |
          .github/scripts/check-image.sh flimanalyzer:ci "${{ github.sha }}"
          mkdir -p work/data
          printf 'x\ty\n1\t2\n3\t4\n' > work/data/Results_FOV1_WT_1.txt
          # Summarize needs at least one feature (#204): select both columns
          printf '{"tools": {"Summarize": {"config": {"features": ["x", "y"]}}}}\n' \
            > work/settings.json
          docker run --rm -u "$(id -u)" -v "$PWD/work:/work" flimanalyzer:ci \
            -i data -o results -c settings.json --run Summarize --no-prefect-server
          test -s work/results/Imported.txt
          test -n "$(find work/results/Summarize -name 'Table_Summary.txt')"

  docs:
    name: docs
    # builds the documentation as Read the Docs does (.readthedocs.yaml): only the
    # "docs" dependency group, flimanalyzer imported from the source tree; warnings fail
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install the docs dependency group
        run: uv sync --frozen --only-group docs --python 3.12

      - name: Build the documentation
        run: uv run --frozen --no-sync python -m sphinx -W --keep-going -E -b html docs docs/_build/html

  checks:
    name: all checks
    # the one required check (main, release/* ruleset): passes only if every job above
    # passed, so the matrix can change without touching branch protection. The docker
    # job's skipped build (no image changes) counts as passed: its job result is success
    if: always()
    needs: [tests, core, docker, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "A job ended with: $r"; exit 1 ;; esac
          done
