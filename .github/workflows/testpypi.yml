# Test publishing to TestPyPI (test.pypi.org): runs when the branch "testpypi" is pushed.
# (A workflow started by hand would have to be on the default branch, main, which only
# receives released code.)
#
# Builds the commit it is started on with a development version
# "<next minor>.dev<commits since the last release tag>" (e.g. 0.6.0.dev141), so every
# commit gets a new version: PyPI and TestPyPI never accept a file name twice, not even
# after deleting it. Nothing is committed; the format is changed only in this checkout.
#
# Publishing uses trusted publishing (OIDC, no stored token): a pending publisher on
# test.pypi.org for this repository, this workflow file and the environment "testpypi".
# Real releases are published by a separate workflow from the published GitHub release.

name: TestPyPI

on:
  push:
    branches: [testpypi]

permissions:
  contents: read

jobs:
  build:
    name: build (dev version)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the release tags, for the version

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Development version instead of post/local version
        run: |
          python3 - <<'EOF'
          import re
          path = "pyproject.toml"
          text = open(path).read()
          text = text.replace(
              '[tool.versioningit.next-version]\nmethod = "smallest-release"',
              '[tool.versioningit.next-version]\nmethod = "minor"',
          )
          # editing the file makes the tree dirty: set both formats
          text, n = re.subn(
              r'^(distance|distance-dirty) = "[^"]*"',
              lambda m: f'{m.group(1)} = "{{next_version}}.dev{{distance}}"',
              text,
              flags=re.M,
          )
          assert n == 2, "versioningit formats not found"
          open(path, "w").write(text)
          EOF

      - name: Build
        run: uv build --out-dir dist

      - name: Check the version and the files
        id: version
        run: |
          wheel=$(ls dist/*.whl)
          version=$(basename "$wheel" | cut -d- -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Built $version from $(git rev-parse HEAD)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.dev[0-9]+$ ]] || { echo "not a dev version"; exit 1; }
          uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/flimanalyzer/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
