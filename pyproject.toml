[project]
name = "flimanalyzer"
dynamic = ["version"]
dependencies = [
    "dask[distributed]<2024",
    "graphviz<1",
    "importlib-resources<7",
    "joblib<2",
    "matplotlib>3.4,<3.8",
    "networkx<3",
    "numpy>=1.24,<2",
    "pandas>=2,<3",
    "pendulum<3",
    "prefect<2",  # code uses the Prefect 1.x API (Flow, executors, ...)
    "pydot<2",
    "pypubsub<5",
    "scikit-learn<1.4",
    "scipy<1.12",
    "seaborn<0.13",
    "torch>2.7,<3",
    "wxpython<4.3",
    "xlsxwriter<4",
]
requires-python = ">=3.10,<3.12"
description = "Analysis of Fluorescence Lifetime Imaging Microscopy (FLIM) data."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Karsten Siller", email = "khsiller@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.gui-scripts]
flimanalyzer = "flim.analyzerapp:main"

[project.urls]
Homepage = "https://github.com/uvaKCCI/flimanalyzer"
Issues = "https://github.com/uvaKCCI/flimanalyzer/issues"

[build-system]
requires = [
    "hatchling",
    "versioningit",
]
build-backend = "hatchling.build"

[tool.uv.sources]
# CUDA builds on Windows and Linux x86_64; macOS (Intel and Apple Silicon) and
# other platforms fall back to the default PyPI wheels (no CUDA builds exist there).
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.version]
source = "versioningit"

[tool.versioningit.vcs]
match = ["[0-9]*.[0-9]*.[0-9]*", "[0-9]*.[0-9]*.[0-9]*.dev[0-9]*"]
default-tag = "0.0.0"

[tool.versioningit.next-version]
method = "smallest-release"

[tool.versioningit.write]
method = { module = "write_version_info", value = "write_version_info"}
path = "flim/_version.py"

[tool.versioningit.format]
distance = "{base_version}.post{distance}+{vcs}{rev}"
dirty = "{base_version}+d{build_date:%Y%m%d}"
distance-dirty = "{base_version}.post{distance}+{vcs}{rev}.d{build_date:%Y%m%d}"

[tool.hatch.build]
# _version.py is generated at build time and gitignored, so include it explicitly
artifacts = ["flim/_version.py"]

[tool.hatch.build.targets.wheel]
packages = ["flim"]

[tool.hatch.build.targets.sdist]
include = ["/flim", "/README.md", "/LICENSE", "/pyproject.toml", "/write_version_info.py"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["flim"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/_version.py",
]
