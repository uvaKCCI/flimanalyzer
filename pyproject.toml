[project]
name = "flimanalyzer"
dynamic = ["version"]
dependencies = [
    "importlib-resources<7",
    "joblib<2",
    "matplotlib>=3.9,<3.13",  # 3.13 removes boxplot(vert=), still used by seaborn 0.13.2
    "networkx>=3,<4",
    "numpy>=2.1,<3",  # vistiq uses np.unstack (numpy 2.1+)
    "pandas>=2.2.2,<3",  # 2.2.2 is the first release built against numpy 2
    "prefect>=3.4.7,<4",
    "prefect-dask>=0.3.7,<1",  # Dask task runner for prefect 3
    "pypubsub<5",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "seaborn>=0.13.2,<0.14",
    "torch>2.7,<3",
    "torchvision",  # pulled in by vistiq; listed so uv picks the matching CUDA build
    "vistiq @ git+https://github.com/ksiller/vistiq@c1e4cb9364ba4bb1273425c27baeebf74145d0c7",
    "wxpython>=4.2.2,<4.3",
    "xlsxwriter<4",
]
requires-python = ">=3.12"
description = "Analysis of Fluorescence Lifetime Imaging Microscopy (FLIM) data."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Karsten Siller", email = "khsiller@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[dependency-groups]
# Builds the documentation without installing flimanalyzer itself (wxPython has no
# Linux wheels): docs/conf.py imports flim from the source tree and mocks wx, torch,
# prefect and vistiq. Install with `uv sync --only-group docs`.
docs = [
    "sphinx>=8,<9",
    "sphinx-rtd-theme>=3,<4",
    "myst-parser>=4,<5",
    # lightweight runtime dependencies imported by the documented modules
    "importlib-resources<7",
    "joblib<2",
    "matplotlib>=3.9,<3.13",
    "networkx>=3,<4",
    "numpy>=2.1,<3",
    "pandas>=2.2.2,<3",
    "pypubsub<5",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "seaborn>=0.13.2,<0.14",
    "xlsxwriter<4",
]

[project.gui-scripts]
flimanalyzer = "flim.analyzerapp:main"

[project.urls]
Homepage = "https://github.com/uvaKCCI/flimanalyzer"
Issues = "https://github.com/uvaKCCI/flimanalyzer/issues"

[build-system]
requires = [
    "hatchling",
    "versioningit",
]
build-backend = "hatchling.build"

[tool.uv.sources]
# CUDA builds on Windows and Linux x86_64; macOS (Intel and Apple Silicon) and
# other platforms fall back to the default PyPI wheels (no CUDA builds exist there).
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.version]
source = "versioningit"

[tool.hatch.metadata]
# vistiq is not on PyPI and is installed from its git repository
allow-direct-references = true

[tool.versioningit.vcs]
# release tags: v1.2.3, v1.2.3rc1, v1.2.3.dev1 (the leading "v" is dropped from the version)
match = ["v[0-9]*.[0-9]*.[0-9]*"]
# git describe patterns are globs, so exclude tags like v0.4.1-publication
exclude = ["*-*"]
default-tag = "v0.0.0"

[tool.versioningit.next-version]
method = "smallest-release"

[tool.versioningit.write]
method = { module = "write_version_info", value = "write_version_info"}
path = "flim/_version.py"

[tool.versioningit.format]
distance = "{base_version}.post{distance}+{vcs}{rev}"
dirty = "{base_version}+d{build_date:%Y%m%d}"
distance-dirty = "{base_version}.post{distance}+{vcs}{rev}.d{build_date:%Y%m%d}"

[tool.hatch.build]
# _version.py is generated at build time and gitignored, so include it explicitly
artifacts = ["flim/_version.py"]

[tool.hatch.build.targets.wheel]
packages = ["flim"]

[tool.hatch.build.targets.sdist]
include = ["/flim", "/README.md", "/LICENSE", "/pyproject.toml", "/write_version_info.py"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["flim"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/_version.py",
]
