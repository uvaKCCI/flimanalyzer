# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

sphinx:
  configuration: docs/conf.py

formats:
  - pdf

# the docs only need Sphinx and the packages in docs/requirements.txt (the code is
# imported from the source tree by docs/conf.py, with GUI and heavy packages mocked)
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
  install:
    - requirements: docs/requirements.txt
